<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1222">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Shap khela</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: full-screen game. A slim HUD strip on top (snake level, health, score, buttons),
   and the board fills everything below it. Single dark look by choice. */
:root {
  --bg: #0b1222;
  --bg-glow: #17284f;
  --board-a: #111b33;
  --board-b: #0e172c;
  --dot: #1c2a4b;
  --panel: #131e38;
  --panel-line: #25365e;
  --text: #e9eef9;
  --muted: #8e9dbb;
  --tier: #8bf5c8;
  --gold: #ffd166;
  --good: #5fd38d;
  --danger: #ff4d6d;
  --heart: #ff5c9a;
  --on-accent: #05221a;
  --font-display: 'Rubik Mono One', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { background: var(--bg); }
body {
  background-color: var(--bg);
  color: var(--text);
  font: 16px/1.45 var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
}
.stage { height: 100%; display: flex; flex-direction: column; }

/* ---------- HUD ---------- */
.hud {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--panel-line);
}
.tier { flex: 1 1 150px; max-width: 240px; min-width: 130px; display: flex; flex-direction: column; gap: 4px; }
.tier-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.tier-name { font: 400 13px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; color: var(--tier); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv { font: 500 12px var(--font-data); color: var(--muted); white-space: nowrap; }
.status { font: 700 11px var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; color: #8fe3ff; margin-left: auto; white-space: nowrap; }
.bar { height: 8px; border-radius: 5px; background: var(--panel-line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 5px; transition: width 160ms ease-out; }
#xpFill { background: var(--tier); }
.hp { flex: 2 1 170px; min-width: 150px; max-width: 360px; display: flex; align-items: center; gap: 8px; }
.hp svg { width: 22px; height: 22px; flex: none; fill: var(--heart); }
.hp .bar { flex: 1; height: 14px; border-radius: 7px; }
.hp .bar i { background: var(--good); border-radius: 7px; }
.hp.mid .bar i { background: var(--gold); }
.hp.low .bar i { background: var(--danger); }
.hp.low svg { animation: beat 0.8s ease-in-out infinite; }
.hp b { font: 700 13px var(--font-data); font-variant-numeric: tabular-nums; min-width: 62px; text-align: right; }
.hp.hurt { animation: shake 320ms ease-out; }
.nums { display: flex; gap: 16px; }
.num span { display: block; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.num b { display: block; font: 700 19px/1.2 var(--font-data); font-variant-numeric: tabular-nums; }
.num b.pop { animation: pop 260ms ease-out; }
.num b.hot { color: var(--gold); }
.btns { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.2); color: var(--gold); } 100% { transform: scale(1); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.btn {
  font: 600 14px/1 var(--font-body); color: var(--text); background: var(--bg);
  border: 1px solid var(--panel-line); border-radius: 9px; min-height: 36px; padding: 0 12px;
  cursor: pointer; transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
}
.btn:hover { border-color: var(--tier); }
.btn:active { transform: translateY(1px) scale(0.98); }
.btn:focus-visible { outline: 2px solid var(--tier); outline-offset: 2px; }
.btn[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.padBtn[aria-pressed="false"] { text-decoration: none; }
.padBtn[aria-pressed="true"] { border-color: var(--tier); }
.btn.primary { background: var(--tier); color: var(--on-accent); border-color: var(--tier); padding: 0 30px; min-height: 48px; font-size: 16px; }
.padBtn { display: none; }

/* ---------- field ---------- */
.field { position: relative; flex: 1; min-height: 0; background: var(--bg); }
canvas.board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.overlay {
  position: absolute; inset: 0; display: flex; padding: 16px;
  background: rgba(8, 13, 26, 0.78); backdrop-filter: blur(3px); overflow: auto;
}
.ov-card { margin: auto; width: 100%; max-width: 580px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.ov-kicker { margin: 0; font: 500 12px/1 var(--font-data); letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.ov-card h2 { margin: 0; font: 400 clamp(26px, 6vw, 40px)/1.05 var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; text-wrap: balance; color: var(--tier); }
.ov-card p { margin: 0; color: var(--muted); font-size: 15px; text-wrap: balance; }
.ov-stats { display: flex; gap: 26px; }
.ov-stats div span { display: block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.ov-stats div b { font: 700 26px/1.2 var(--font-data); font-variant-numeric: tabular-nums; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; width: 100%; text-align: left; }
.lg { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.lg h3 { margin: 0 0 6px; font: 500 11px var(--font-data); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.lg.bad h3 { color: var(--danger); }
.lg ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lg li { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; }
.lg li canvas { width: 34px; height: 34px; flex: none; }
.lg li span { min-width: 0; }
.lg li small { display: block; color: var(--muted); font-size: 12px; line-height: 1.25; }
.tiers { display: flex; flex-wrap: wrap; gap: 6px 10px; justify-content: center; width: 100%; }
.tiers span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.tiers i { width: 18px; height: 8px; border-radius: 4px; display: block; }
.hint { font-size: 13px !important; }
.hint-touch { display: none; }

.dpad {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px;
  display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 6px; opacity: 0.55; user-select: none;
}
.dpad button { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; color: var(--tier); font-size: 20px; touch-action: none; cursor: pointer; }
.dpad button:active { background: var(--panel-line); }
.dpad .up { grid-column: 2; grid-row: 1; }
.dpad .left { grid-column: 1; grid-row: 2; }
.dpad .down { grid-column: 2; grid-row: 2; }
.dpad .right { grid-column: 3; grid-row: 2; }

@media (pointer: coarse) {
  .padBtn { display: inline-block; }
  .btn { min-height: 40px; }
  .hint-keys { display: none; }
  .hint-touch { display: block; }
}
@media (max-width: 520px) {
  .tier { max-width: none; }
  .hp { max-width: none; }
  .num b { font-size: 17px; }
  .num.opt { display: none; }
  .nums { gap: 14px; }
  .btn { padding: 0 9px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .num b.pop, .hp.hurt, .hp.low svg { animation: none; }
  .btn, .bar i { transition: none; }
}
</style>

</head>
<body>
<div class="stage">
  <header class="hud">
    <div class="tier">
      <div class="tier-top"><span class="tier-name" id="tierName">Hatchling</span><span class="lv" id="lvEl">LV 1</span><span class="status" id="statusEl" hidden></span></div>
      <div class="bar" role="progressbar" aria-label="Level progress"><i id="xpFill"></i></div>
    </div>
    <div class="hp" id="hpWrap" role="group" aria-label="Health">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <div class="bar"><i id="hpFill"></i></div>
      <b id="hpText">100/100</b>
    </div>
    <div class="nums">
      <div class="num"><span>Score</span><b id="scoreEl">0</b></div>
      <div class="num opt"><span>Best</span><b id="bestEl">0</b></div>
      <div class="num"><span>Combo</span><b id="comboEl">x1</b></div>
    </div>
    <div class="btns">
      <button class="btn" id="pauseBtn" type="button">Pause</button>
      <button class="btn" id="sfxBtn" type="button" aria-pressed="true">Sound</button>
      <button class="btn" id="musicBtn" type="button" aria-pressed="true">Music</button>
      <button class="btn padBtn" id="padBtn" type="button" aria-pressed="false">Pad</button>
      <button class="btn" id="fsBtn" type="button">Full</button>
    </div>
  </header>

  <main class="field" id="field">
    <canvas class="board" id="board" role="img" aria-label="Shap khela game board"></canvas>
    <div class="dpad" id="dpad" hidden aria-label="Direction pad">
      <button class="up" type="button" data-dx="0" data-dy="-1" aria-label="Up">&#9650;</button>
      <button class="left" type="button" data-dx="-1" data-dy="0" aria-label="Left">&#9664;</button>
      <button class="down" type="button" data-dx="0" data-dy="1" aria-label="Down">&#9660;</button>
      <button class="right" type="button" data-dx="1" data-dy="0" aria-label="Right">&#9654;</button>
    </div>
    <div class="overlay" id="overlay">
      <div class="ov-card">
        <p class="ov-kicker" id="ovKicker">Arcade classic</p>
        <h2 id="ovTitle">Shap khela</h2>
        <p id="ovText">Eat to grow and evolve. Keep your health up, and stay away from poison and bombs.</p>
        <div class="ov-stats" id="ovStats" hidden></div>
        <button class="btn primary" id="ovBtn" type="button">Play</button>
        <p class="hint hint-keys">Arrow keys or WASD to steer &nbsp;·&nbsp; Space to pause</p>
        <p class="hint hint-touch">Swipe on the board to steer</p>
        <div class="legend" id="legend"></div>
        <div class="tiers" id="tierStrip" aria-label="Snake levels"></div>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var field = $('field'), cv = $('board'), ctx = cv.getContext('2d');
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(n) { return Math.floor(Math.random() * n); }

  /* ---------- data ---------- */
  var C = {
    bg: '#0b1222', a: '#111b33', b: '#0e172c', dot: '#1c2a4b', text: '#e9eef9',
    head: '#8bf5c8', tail: '#2f7fd0', fruit: '#ff6a55', gold: '#ffd166', danger: '#ff4d6d', good: '#5fd38d', heart: '#ff5c9a'
  };
  var TIERS = [
    { name: 'Hatchling', head: '#8bf5c8', tail: '#2f7fd0' },
    { name: 'Garden Snake', head: '#c6f56b', tail: '#2fa66a' },
    { name: 'Viper', head: '#ffd166', tail: '#e07a2f' },
    { name: 'Cobra', head: '#ff9ad5', tail: '#8a4fd6' },
    { name: 'Python', head: '#7ee8ff', tail: '#3a56e0' },
    { name: 'Basilisk', head: '#ff8a6b', tail: '#a1224a' },
    { name: 'Dragon', head: '#fff2a8', tail: '#ff5a3c' },
    { name: 'Leviathan', head: '#ffffff', tail: '#ffb000' }
  ];
  var ITEMS = {
    apple:  { label: 'Apple', note: '+10 points', glow: '#ff6a55', grow: 1, xp: 1, pts: 10, group: 'eat' },
    orange: { label: 'Orange', note: '+15 points', glow: '#ffa63d', grow: 1, xp: 1, pts: 15, group: 'eat' },
    grape:  { label: 'Grapes', note: '+25 points, grows 2 (level 2+)', glow: '#a779ff', grow: 2, xp: 2, pts: 25, group: 'eat' },
    star:   { label: 'Golden star', note: '+50 bonus, vanishes fast', glow: '#ffd166', grow: 1, xp: 3, pts: 50, group: 'eat' },
    heart:  { label: 'Heart', note: 'Restores 25 health', glow: '#ff5c9a', grow: 0, xp: 0, pts: 5, group: 'eat' },
    frost:  { label: 'Frost', note: 'Slows the snake for 6s (level 2+)', glow: '#8fe3ff', grow: 0, xp: 1, pts: 10, group: 'eat' },
    poison: { label: 'Poison flask', note: 'Costs 20 health', glow: '#7bff5a', grow: 0, xp: 0, pts: 0, group: 'avoid' },
    bomb:   { label: 'Bomb', note: 'Instant game over', glow: '#ff2a45', grow: 0, xp: 0, pts: 0, group: 'avoid' }
  };
  var COMBO_WINDOW = 3000, POISON_DMG = 20, HEAL = 25, FROST_MS = 6000;
  function tierOf(level) { return TIERS[Math.min(level, TIERS.length) - 1]; }
  function need(level) { return 5 + 2 * level; }
  function maxHpFor(level) { return 100 + 10 * (level - 1); }
  function speedFor(level) { return Math.max(60, 135 - (level - 1) * 6); }

  function rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
  function rgba(h, a) { var c = rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  var HEAD = rgb(C.head), TAIL = rgb(C.tail);
  function mix(t, a) {
    return 'rgba(' + Math.round(lerp(HEAD[0], TAIL[0], t)) + ',' + Math.round(lerp(HEAD[1], TAIL[1], t)) + ',' +
      Math.round(lerp(HEAD[2], TAIL[2], t)) + ',' + (a == null ? 1 : a) + ')';
  }
  function mixHex(t) {
    return '#' + [0, 1, 2].map(function (i) { return ('0' + Math.round(lerp(HEAD[i], TAIL[i], t)).toString(16)).slice(-2); }).join('');
  }
  function setTierColors(level) {
    var t = tierOf(level);
    C.head = t.head; C.tail = t.tail; HEAD = rgb(t.head); TAIL = rgb(t.tail);
    document.documentElement.style.setProperty('--tier', t.head);
  }

  /* ---------- storage (per viewer, optional) ---------- */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  };
  var best = parseInt(store.get('shapkhela.best', '0'), 10) || 0;
  var sfxOn = store.get('shapkhela.sfx', '1') === '1';
  var musicOn = store.get('shapkhela.music', '1') === '1';

  /* ---------- audio: all synthesized with Web Audio ---------- */
  var Au = {
    ctx: null,
    init: function () {
      if (this.ctx) { if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} } return; }
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
      var c = this.ctx;
      this.comp = c.createDynamicsCompressor();
      this.master = c.createGain(); this.master.gain.value = 0.85;
      this.sfx = c.createGain(); this.sfx.gain.value = sfxOn ? 1 : 0;
      this.mus = c.createGain(); this.mus.gain.value = 0.5;
      this.sfx.connect(this.master); this.mus.connect(this.master);
      this.master.connect(this.comp); this.comp.connect(c.destination);
      var len = c.sampleRate, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
    },
    tone: function (o) {
      var c = this.ctx; if (!c) return;
      var t = (o.at != null) ? o.at : c.currentTime + (o.delay || 0);
      var osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(o.freq, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + o.dur);
      var v = (o.vol != null) ? o.vol : 0.2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      osc.connect(g); g.connect(o.bus || this.sfx);
      osc.start(t); osc.stop(t + o.dur + 0.05);
    },
    noise: function (o) {
      var c = this.ctx; if (!c || !this.noiseBuf) return;
      var t = (o.at != null) ? o.at : c.currentTime + (o.delay || 0);
      var src = c.createBufferSource(); src.buffer = this.noiseBuf;
      var f = c.createBiquadFilter(); f.type = o.type || 'lowpass';
      f.frequency.setValueAtTime(o.freq || 1000, t);
      if (o.slide) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.slide), t + o.dur);
      var g = c.createGain();
      g.gain.setValueAtTime(o.vol != null ? o.vol : 0.2, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      src.connect(f); f.connect(g); g.connect(o.bus || this.sfx);
      src.start(t, Math.random() * 0.2); src.stop(t + o.dur + 0.05);
    }
  };
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  var PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];

  var Sfx = {
    on: function () { return sfxOn && Au.ctx; },
    start: function () {
      if (!this.on()) return;
      Au.tone({ freq: 196, slide: 784, type: 'sawtooth', dur: 0.28, vol: 0.12 });
      Au.tone({ freq: mtof(72), type: 'square', dur: 0.1, vol: 0.12, delay: 0.26 });
      Au.tone({ freq: mtof(79), type: 'square', dur: 0.16, vol: 0.12, delay: 0.34 });
    },
    turn: function () { if (this.on()) Au.tone({ freq: 620, slide: 480, type: 'triangle', dur: 0.045, vol: 0.06 }); },
    eat: function (combo, type) {
      if (!this.on()) return;
      var n = 60 + PENT[Math.min(combo - 1, PENT.length - 1)] + (type === 'orange' ? 2 : type === 'grape' ? 4 : 0);
      Au.tone({ freq: mtof(n), type: 'square', dur: 0.09, vol: 0.15 });
      Au.tone({ freq: mtof(n + 12), type: 'square', dur: 0.14, vol: 0.12, delay: 0.07 });
      Au.tone({ freq: mtof(n - 12), slide: mtof(n - 24), type: 'sine', dur: 0.16, vol: 0.28 });
      if (type === 'grape') Au.tone({ freq: mtof(n + 19), type: 'triangle', dur: 0.14, vol: 0.1, delay: 0.14 });
      Au.noise({ type: 'highpass', freq: 5000, dur: 0.05, vol: 0.06 });
    },
    heal: function () {
      if (!this.on()) return;
      [76, 79, 83, 88].forEach(function (m, i) {
        Au.tone({ freq: mtof(m), type: 'sine', dur: 0.2, vol: 0.16, delay: i * 0.06 });
        Au.tone({ freq: mtof(m + 12), type: 'triangle', dur: 0.14, vol: 0.05, delay: i * 0.06 });
      });
    },
    frost: function () {
      if (!this.on()) return;
      [96, 91, 88, 84].forEach(function (m, i) { Au.tone({ freq: mtof(m), type: 'sine', dur: 0.3, vol: 0.1, delay: i * 0.07 }); });
      Au.noise({ type: 'highpass', freq: 7000, dur: 0.4, vol: 0.07 });
    },
    poison: function () {
      if (!this.on()) return;
      Au.tone({ freq: 260, slide: 70, type: 'sawtooth', dur: 0.4, vol: 0.2 });
      Au.tone({ freq: 277, slide: 80, type: 'square', dur: 0.4, vol: 0.1 });
      Au.noise({ type: 'bandpass', freq: 900, slide: 200, dur: 0.35, vol: 0.14 });
    },
    hazard: function () { if (this.on()) Au.tone({ freq: 120, slide: 70, type: 'sawtooth', dur: 0.14, vol: 0.06 }); },
    beat: function () {
      if (!this.on()) return;
      Au.tone({ freq: 70, slide: 45, type: 'sine', dur: 0.12, vol: 0.4 });
      Au.tone({ freq: 70, slide: 45, type: 'sine', dur: 0.12, vol: 0.3, delay: 0.17 });
    },

  /* ---------- input ---------- */
  var KEYS = {

    if (Math.abs(dx) > Math.abs(dy)) handleDir(dx > 0 ? 1 : -1, 0); else handleDir(0, dy > 0 ? 1 : -1);
    tx = t.clientX; ty = t.clientY;
  }, { passive: false });
  cv.addEventListener('touchend', function () { touching = false; }, { passive: true });

  Array.prototype.forEach.call(document.querySelectorAll('.dpad button'), function (b) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); handleDir(parseInt(b.dataset.dx, 10), parseInt(b.dataset.dy, 10)); });
  });

  ovBtn.addEventListener('click', function () { primary(); ovBtn.blur(); });
  pauseBtn.addEventListener('click', function () {
    if (G.state === 'ready' || G.state === 'over') primary(); else togglePause();
    pauseBtn.blur();
  });

  var sfxBtn = $('sfxBtn'), musicBtn = $('musicBtn'), padBtn = $('padBtn'), fsBtn = $('fsBtn'), dpad = $('dpad');
  function paintToggles() {
    sfxBtn.textContent = 'Sound'; sfxBtn.setAttribute('aria-pressed', String(sfxOn));
    musicBtn.textContent = 'Music'; musicBtn.setAttribute('aria-pressed', String(musicOn));
    padBtn.textContent = 'Pad'; padBtn.setAttribute('aria-pressed', String(!dpad.hidden));
  }
  function toggleSfx() {
    Au.init();
    sfxOn = !sfxOn; store.set('shapkhela.sfx', sfxOn ? '1' : '0');
    if (Au.sfx) Au.sfx.gain.setTargetAtTime(sfxOn ? 1 : 0, Au.ctx.currentTime, 0.015);
    paintToggles(); Sfx.ui();
  }
  function toggleMusic() {
    Au.init();
    musicOn = !musicOn; store.set('shapkhela.music', musicOn ? '1' : '0');
    if (musicOn) { if (G.state === 'playing') Music.start(); } else Music.stop();
    paintToggles(); Sfx.ui();
  }
  function toggleFs() {
    try {
      var el = document.documentElement;
      if (document.fullscreenElement) { var p1 = document.exitFullscreen(); if (p1 && p1.catch) p1.catch(function () {}); }
      else if (el.requestFullscreen) { var p2 = el.requestFullscreen(); if (p2 && p2.catch) p2.catch(function () {}); }
    } catch (e) { /* ignore */ }
  }
  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  sfxBtn.addEventListener('click', function () { toggleSfx(); sfxBtn.blur(); });
  musicBtn.addEventListener('click', function () { toggleMusic(); musicBtn.blur(); });
  padBtn.addEventListener('click', function () { dpad.hidden = !dpad.hidden; paintToggles(); padBtn.blur(); });
  fsBtn.addEventListener('click', function () { toggleFs(); fsBtn.blur(); });

  document.addEventListener('visibilitychange', function () { if (document.hidden && G.state === 'playing') pause(); });

  /* ---------- legend (drawn with the same code as the game) ---------- */
  function buildLegend() {
    var cols = { eat: [], avoid: [] };
    Object.keys(ITEMS).forEach(function (k) { cols[ITEMS[k].group].push(k); });
    function col(title, cls, keys) {
      return '<div class="lg ' + cls + '"><h3>' + title + '</h3><ul>' + keys.map(function (k) {
        return '<li><canvas width="68" height="68" data-item="' + k + '"></canvas><span><b>' + ITEMS[k].label + '</b><small>' + ITEMS[k].note + '</small></span></li>';
      }).join('') + '</ul></div>';
    }
    legend.innerHTML = col('Eat these', 'good', cols.eat) +
      '<div>' + col('Avoid these', 'bad', cols.avoid) +
      '<div class="lg" style="margin-top:10px"><h3>Also deadly</h3><small style="color:var(--muted);font-size:13px">Walls and your own tail end the run instantly.</small></div></div>';
    Array.prototype.forEach.call(legend.querySelectorAll('canvas[data-item]'), function (c) {
      var x = c.getContext('2d'); x.scale(2, 2);
      drawItem(x, c.getAttribute('data-item'), 17, 18, 28, 500, 1);
    });
    tierStrip.innerHTML = TIERS.map(function (t, i) {
      return '<span><i style="background:linear-gradient(90deg,' + t.head + ',' + t.tail + ')"></i>' + (i + 1) + ' ' + t.name + '</span>';
    }).join('');
  }

  /* ---------- boot ---------- */
  buildLegend();
  paintToggles();
  function onResize() {
    if (G.state === 'ready') { pickGrid(); reset(); }
    layout();
  }
  pickGrid(); reset(); layout();
  showOverlay('ready');
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(field);
  window.addEventListener('resize', onResize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); });
  requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
